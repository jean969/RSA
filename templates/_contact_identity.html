{% if contact.avatar_name %}<img class="avatar" src="{{ url_for('avatar', filename=contact.avatar_name) }}" alt="Photo de {{ contact.username }}">{% else %}<div class="avatar placeholder">{{ (contact.display_name or contact.username)[0]|upper }}</div>{% endif %}<div class="contact-identity"><strong>{{ contact.display_name or contact.username }}</strong><span>@{{ contact.username }}</span></div>
